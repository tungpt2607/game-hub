name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # PostgreSQL thật cho kiểm thử tích hợp (dữ liệu bị xoá sau mỗi lần chạy).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gamehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d gamehub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/gamehub_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trên pull request: cho phép cập nhật pnpm-lock.yaml và đẩy ngược vào nhánh.
      # Trên main: bắt buộc khớp file khóa.
      - name: Install
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      # Sinh file migration từ packages/db/src/schema.ts (không cần kết nối DB).
      - name: Sinh migration
        run: pnpm db:generate

      # Trên pull request: đẩy file khóa phiên bản và migration mới sinh ngược vào nhánh.
      - name: Commit file sinh tự động nếu có thay đổi
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain -- pnpm-lock.yaml packages/db/migrations)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml packages/db/migrations
            git commit -m "Cập nhật file sinh tự động từ CI (pnpm-lock.yaml, migration)"
            git push
          fi

      # Trên main: migration trong repo phải khớp với lược đồ.
      - name: Kiểm tra migration khớp lược đồ
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- packages/db/migrations)" ]; then
            echo "::error::Lược đồ đã đổi nhưng thiếu file migration. Chạy pnpm db:generate."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Chạy riêng kiểm thử cơ sở dữ liệu (không qua turbo) để chắc chắn có PostgreSQL thật;
      # bài kiểm tra "CI có cấu hình TEST_DATABASE_URL" sẽ báo lỗi nếu thiếu.
      - name: Test cơ sở dữ liệu
        run: pnpm --workspace-concurrency=1 --filter @opes/db --filter @opes/api exec vitest run --reporter=verbose

      - name: Build
        run: pnpm build

  docker:
    name: Docker ${{ matrix.app }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, cms, play]
    steps:
      # Lấy đầu nhánh mới nhất, gồm cả pnpm-lock.yaml vừa được job check đẩy lên.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Build image
        run: |
          if [ "${{ matrix.app }}" = "api" ]; then
            docker build -f docker/Dockerfile.api -t opes-gamehub-api .
          else
            docker build -f docker/Dockerfile.next --build-arg APP=${{ matrix.app }} -t opes-gamehub-${{ matrix.app }} .
          fi

      - name: Chạy thử API trong container
        if: matrix.app == 'api'
        run: |
          docker run -d --name api -p 4000:4000 opes-gamehub-api
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:4000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
